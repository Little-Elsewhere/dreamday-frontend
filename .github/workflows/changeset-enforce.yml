name: Changeset Enforce

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changeset files
        run: |
          # Skip for docs-only changes
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs: ]]; then
            echo "Skipping changeset check for docs PR"
            exit 0
          fi

          # Skip for dependabot
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "Skipping changeset check for dependabot PR"
            exit 0
          fi

          # Skip for GitHub Actions (changesets auto-created PRs)
          if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "Skipping changeset check for GitHub Actions PR"
            exit 0
          fi

          # Check for changeset files
          if [ -z "$(ls -A .changeset/*.md 2>/dev/null)" ]; then
            echo "=========================================="
            echo "ERROR: No changeset file found!"
            echo "=========================================="
            echo ""
            echo "Every PR that changes code must include a changeset file."
            echo ""
            echo "To add a changeset, run:"
            echo ""
            echo "  pnpm changeset"
            echo ""
            echo "This will create a file in .changeset/ directory."
            echo "Then add and commit that file to your PR."
            echo "=========================================="
            exit 1
          fi

          echo "Changeset files found!"
          ls -la .changeset/*.md
