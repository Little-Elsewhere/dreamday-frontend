name: Auto Merge PR

on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Resolve pull request
        id: pr
        run: |
          pr_json="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq 'map(select(.state == "open" and .base.ref == "develop")) | .[0] // empty')"
          if [ -z "$pr_json" ]; then
            echo 'No open develop PR for this commit; skipping.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number="$(printf '%s' "$pr_json" | jq -r '.number')"
          draft="$(printf '%s' "$pr_json" | jq -r '.draft')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Merge rebase and delete head branch
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.draft == 'false'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --repo "$REPO" --rebase --delete-branch
