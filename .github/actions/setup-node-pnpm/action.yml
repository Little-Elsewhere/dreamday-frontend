name: Setup Node and pnpm
description: Install pnpm, set up Node.js with the pnpm store cache, and install dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.8.1

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: HUSKY=0 pnpm install --frozen-lockfile
