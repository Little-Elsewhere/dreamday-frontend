name: dreamday-dev

services:
  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    init: true
    env_file:
      - ../../.env
    ports:
      - '127.0.0.1:4000:4000'
      # Keep Node inspector ports local to this machine.
      - '127.0.0.1:9229:9229'
      - '127.0.0.1:9230:9230'
    volumes:
      - type: bind
        source: ../..
        target: /app
      - type: volume
        source: dev_node_modules
        target: /app/node_modules
      - type: volume
        source: dev_next
        target: /app/.next

volumes:
  dev_node_modules:
  dev_next:
