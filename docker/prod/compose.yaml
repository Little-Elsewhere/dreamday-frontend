name: dreamday-prod

services:
  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      secrets:
        - doppler_token
    init: true
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DOPPLER_ENVIRONMENT: prod
    secrets:
      - doppler_token

secrets:
  doppler_token:
    environment: DOPPLER_TOKEN
