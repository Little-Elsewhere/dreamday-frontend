name: dreamday-prod

services:
  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:?}
        NEXT_PUBLIC_APP_DEFAULT_TITLE: ${NEXT_PUBLIC_APP_DEFAULT_TITLE:?}
        NEXT_PUBLIC_APP_TITLE_TEMPLATE: ${NEXT_PUBLIC_APP_TITLE_TEMPLATE:?}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION:?}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    init: true
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - '4000:4000'
