  'handlebars': '>=4.7.10'
  'dompurify': '>=3.4.17'
  'body-parser': '>=2.4.0'
  'undici': '>=7.30.1'
  'fast-uri': '>=3.1.9'
  'zod': '>=4.6.6'
  'ip-address': '>=10.7.4'
