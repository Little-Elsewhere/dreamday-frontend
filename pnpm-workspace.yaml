  'sharp': 'npm:sharp@0.35.4'
  'brace-expansion': 'npm:brace-expansion@5.0.12'
  'browserslist': 'npm:browserslist@4.29.0'
  'fast-uri': 'npm:fast-uri@3.1.6'
  'js-yaml': 'npm:js-yaml@4.3.2'
  '@xmldom/xmldom': 'npm:@xmldom/xmldom@0.8.15'
  'hono': 'npm:hono@4.13.8'
  'qs': 'npm:qs@6.16.0'
  'minimatch': 'npm:minimatch@10.2.5'
