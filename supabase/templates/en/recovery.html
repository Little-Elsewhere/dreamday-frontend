<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body>
    <main>
      <h1>Reset your Dreamday password</h1>
      <p>We received a password reset request for {{ .Email }}.</p>
      <p>Follow the link below to choose a new password.</p>
      <p>
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}"
        >
          Reset password
        </a>
      </p>
      <p>If you did not request a password reset, you can ignore this email.</p>
    </main>
  </body>
</html>
