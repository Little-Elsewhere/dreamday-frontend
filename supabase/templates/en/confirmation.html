<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email</title>
  </head>
  <body>
    <main>
      <h1>Confirm your email</h1>
      <p>Hello {{ .Data.full_name }},</p>
      <p>Confirm your email address to finish creating your Dreamday account.</p>
      <p>
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
        >
          Confirm email
        </a>
      </p>
      <p>If you did not create a Dreamday account, you can ignore this email.</p>
    </main>
  </body>
</html>
